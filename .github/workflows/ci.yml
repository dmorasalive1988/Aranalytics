name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pluma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluma_test
      SERVICES_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluma_test_services
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluma_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pluma_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm -r --workspace-concurrency=1 typecheck
      - name: Pruebas de dominio, base de datos, servicios, diseño e idiomas
        run: |
          for p in domain db adapters emails connectors pdf services ui i18n; do
            (cd packages/$p && pnpm vitest run)
          done
      - name: Build
        run: pnpm --filter @pluma/web build && pnpm --filter @pluma/admin build
      - name: Criterios de aceptación (Playwright)
        run: |
          pnpm --filter @pluma/web exec playwright install --with-deps chromium
          pnpm --filter @pluma/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }
